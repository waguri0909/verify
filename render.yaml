services:
  - type: web
    name: discord-verify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: WEB_PUBLIC_URL
        sync: false
      - key: WEB_SECRET
        generateValue: true
      - key: VERIFIED_ROLE_NAME
        value: 인증완료
      - key: UNVERIFIED_ROLE_NAME
        value: 미인증
      - key: PYTHON_VERSION
        value: 3.12.0
